name: Clean up storage

# Keeps GitHub storage near zero: deletes every workflow artifact and trims old workflow runs
# (and their logs). Releases are untouched. Runs after each build, weekly, and on demand.

on:
  workflow_run:
    workflows: ["Build APK"]
    types: [completed]
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[].id' | while read -r id; do
            echo "Deleting artifact $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true
          done

      - name: Delete old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 20 # most recent runs kept per workflow
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows" --jq '.workflows[].id' |
          while read -r wf; do
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?per_page=100" \
              --jq '.workflow_runs[] | select(.status == "completed") | .id' |
              tail -n +$((KEEP + 1)) | while read -r run; do
                echo "Deleting run $run"
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run" || true
              done
          done
