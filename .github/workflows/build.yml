name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # publish the "latest" release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # versionCode is the commit count

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and lint
        run: ./gradlew assembleDebug assembleRelease lintDebug

      # Releases don't count against the Actions artifact storage quota.
      - name: Publish "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=$(git rev-list --count HEAD)
          apk="SystemTools-build${build}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "$apk" \
            --target "$GITHUB_SHA" \
            --title "System Tools build $build" \
            --notes "Build $build from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}. Installs over any earlier build."
